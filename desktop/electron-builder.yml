appId: com.akrc.angel-engine
productName: Angel Engine
artifactName: Angel-Engine-${version}-${arch}.${ext}
directories:
  output: out/builder
files: []
extraResources:
  - from: build/app-update.yml
    to: app-update.yml
artifactBuildCompleted: scripts/notarize-dmg-artifact.cjs
# Signs/notarizes dmg + zip artifacts built from the already-.app-signed
# prepackaged app; forge osxSign/osxNotarize signs the .app.
mac:
  category: public.app-category.developer-tools
  notarize: true
  icon: assets/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
dmg:
  sign: true
  writeUpdateInfo: false
# monorepo package.json name is "desktop"; do not let that leak into
# Linux package metadata, desktop entry basenames, or the binary name.
# Forge already emits an `angel-engine` binary in the prepackaged dir.
linux:
  category: Development
  icon: assets/icon.png
  executableName: angel-engine
  # Keep .desktop basename / StartupWMClass aligned with package.json desktopName.
  syncDesktopName: true
  desktop:
    entry:
      Name: Angel Engine
      GenericName: Angel Engine
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
deb:
  # Debian Package: field + /opt|/usr install path base. Defaults to
  # package.json "name" ("desktop") unless overridden.
  packageName: angel-engine
win:
  executableName: Angel Engine
  icon: assets/icon.png
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: AkaraChen
  repo: angel-engine
  releaseType: release
